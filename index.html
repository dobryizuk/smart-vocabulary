<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Vocabulary - Spaced Repetition Learning</title>
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/learning.css">
    <link rel="stylesheet" href="css/stats.css">
    <link rel="stylesheet" href="css/today.css">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0F0F0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Smart Vocabulary">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <!-- Today Tab: overview, and the learning session in its place -->
            <div class="tab-content active" id="today-tab">
                <div class="tab-content-inner">
                    <div id="todayView" data-testid="today-view"></div>
                    <div id="learningContent" hidden></div>
                </div>
            </div>

            <!-- Add Words Tab -->
            <div class="tab-content" id="add-tab">
                <div class="tab-content-inner">
                    <h3>Add a word</h3>

                    <!-- Always visible: Original word input -->
                    <div class="form-group">
                        <label for="originalWord">Word or phrase</label>
                        <input type="text" class="form-control" id="originalWord" data-testid="original-word-input" placeholder="e.g., beautiful, break the ice">
                        <div id="formButtons">
                            <!-- Buttons will be inserted here by JavaScript -->
                        </div>
                    </div>

                    <!-- Dictionary results (always visible when shown) -->
                    <div id="dictionaryResults" class="translation-suggestion" style="display: none;">
                        <!-- Dictionary content will be inserted here by JavaScript -->
                    </div>

                    <!-- Collapsible additional fields -->
                    <div id="additionalFields" style="display: none;">
                        <section class="lookup-card">
                            <div class="form-group">
                                <label for="wordPhonetic">Phonetic (pronunciation)</label>
                                <input type="text" class="form-control" id="wordPhonetic" placeholder="e.g., /ˈbjuːtɪfʊl/">
                            </div>

                            <div class="form-group">
                                <label for="wordDefinition">Definition</label>
                                <textarea class="form-control" id="wordDefinition" rows="2" placeholder="Word definition..."></textarea>
                            </div>
                        </section>

                        <div class="form-group">
                            <label for="translation">Translation</label>
                            <input type="text" class="form-control" id="translation" placeholder="e.g., красивый, сломать лед">
                        </div>

                        <div class="form-group">
                            <label for="wordSynonyms">Synonyms (comma-separated)</label>
                            <input type="text" class="form-control" id="wordSynonyms" placeholder="e.g., gorgeous, lovely, attractive">
                        </div>

                        <div class="form-group">
                            <label for="wordExamples">Examples (one per line)</label>
                            <textarea class="form-control" id="wordExamples" rows="3" placeholder="Example sentence 1&#10;Example sentence 2"></textarea>
                        </div>

                        <div id="saveButtons">
                            <!-- Save buttons will be inserted here by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Word List Tab -->
            <div class="tab-content" id="list-tab">
                <div class="tab-content-inner">
                    <div class="word-list-header">
                        <h3>My words <span class="word-list-header__count" id="wordCount">0</span></h3>
                    </div>
                    <div class="word-filters" id="wordFilters" role="group" aria-label="Filter words"></div>
                    <div class="word-list" id="wordList" data-testid="word-list">
                        <div class="empty-state">
                            <h3>No words yet!</h3>
                            <p>Add your first word in the "Add Words" tab</p>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Statistics Tab -->
            <div class="tab-content" id="stats-tab">
                <div class="tab-content-inner">
                    <div id="progressView" data-testid="progress-view"></div>
                    <div id="settingsView" data-testid="settings-view" hidden></div>
                </div>
            </div>
        </div>
    </div>

    <!-- iOS-style Bottom Tab Bar -->
    <nav class="tab-nav" data-testid="tab-nav" aria-label="Main">
        <button class="tab-btn active" data-testid="today-tab-btn">
            <span class="tab-icon" data-icon="home"></span>
            <span>Today</span>
        </button>
        <button class="tab-btn" data-testid="list-tab-btn">
            <span class="tab-icon" data-icon="words"></span>
            <span>Words</span>
        </button>
        <button class="tab-btn" data-testid="add-tab-btn">
            <span class="tab-icon" data-icon="add"></span>
            <span>Add</span>
        </button>
        <button class="tab-btn" data-testid="stats-tab-btn">
            <span class="tab-icon" data-icon="progress"></span>
            <span>Progress</span>
        </button>
    </nav>

    <!-- Bundled JavaScript -->
    <script src="dist/app.bundle.js"></script>
</body>
</html>
